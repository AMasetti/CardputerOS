[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D APP_VERSION=\"${sysenv.APP_VERSION}\"
  ; Rol scan-only forzado en tiempo de compilación: el firmware no puede
  ; anunciarse ni aceptar conexiones aunque algún módulo lo intente por error.
  ; Ver docs/BLE_SENTINEL_SPEC.md "Auto-ocultamiento".
  -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -D CONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
lib_deps =
  m5stack/M5Cardputer@^1.1.1
  h2zero/NimBLE-Arduino@1.4.3
