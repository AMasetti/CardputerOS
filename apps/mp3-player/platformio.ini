; MP3 Player para Cardputer / Cardputer-Adv
; Se instala desde la SD con M5Launcher (solo el firmware.bin de la app, no el merged).

[env:cardputer]
platform = espressif32@6.9.0
board = m5stack-stamps3
framework = arduino
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D APP_VERSION=\"${sysenv.APP_VERSION}\"
lib_deps =
  m5stack/M5Cardputer@^1.1.1
  earlephilhower/ESP8266Audio@^1.9.9
