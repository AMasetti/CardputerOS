name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  os:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build the OS
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          cd os
          idf.py set-target esp32s3
          idf.py build
          V=$(cat version.txt)
          mkdir -p ../out
          cp build/cardputeros.bin ../out/os-v$V.bin
          python -m esptool --chip esp32s3 merge_bin -o ../out/os-v$V-full.bin \
            --flash_mode dio --flash_size 8MB --fill-flash-size 8MB \
            0x0 build/bootloader/bootloader.bin 0x8000 build/partition_table/partition-table.bin \
            0x20000 build/cardputeros.bin
      - uses: actions/upload-artifact@v4
        with:
          name: os
          path: out/*

  apps:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Build every app
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          for d in apps/*/; do
            [ -f "$d/app.json" ] || continue
            python3 sdk/tools/build_app.py "$d" --out out
          done
      - uses: actions/upload-artifact@v4
        with:
          name: apps
          path: out/*.elf

  release:
    needs: [os, apps]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish a release per new version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag = <name>-vX.Y.Z, asset = <tag>.elf (apps) or <tag>.bin (OS), the layout the store reads
          for f in artifacts/*.elf artifacts/os-v*.bin; do
            [ -e "$f" ] || continue
            case "$f" in *-full.bin) continue;; esac
            base=$(basename "$f"); tag="${base%.*}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "$tag already released"; continue
            fi
            extra=""
            [ "${tag%%-v*}" = "os" ] && extra="artifacts/$tag-full.bin"
            gh release create "$tag" "$f" $extra --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "$tag" --notes "Automated build of $tag"
          done
