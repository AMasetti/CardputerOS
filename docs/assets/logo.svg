<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="CardputerOS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2030"/><stop offset="1" stop-color="#0a0c12"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="40" y="62" width="176" height="132" rx="18" fill="#0a0c12" stroke="url(#ac)" stroke-width="10"/>
  <!-- prompt: "> _" -->
