  <rect x="124" y="146" width="54" height="12" rx="6" fill="#e1e4ee"/>
  <!-- keyboard row -->
  <g fill="#78829a">
    <rect x="56" y="206" width="24" height="12" rx="4"/><rect x="88" y="206" width="24" height="12" rx="4"/>
    <rect x="120" y="206" width="24" height="12" rx="4"/><rect x="152" y="206" width="24" height="12" rx="4"/>
    <rect x="184" y="206" width="16" height="12" rx="4"/>
  </g>
</svg>
